<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pit View</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.production.min.js" crossorigin></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: 'Roboto', sans-serif; background-color: #f8f9fa; overflow: hidden; }
    .hidden { display: none !important; }
    .alliance-card { padding: 8px 12px; border-radius: 4px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; }
    .winner { border: 2px solid #9073da; opacity: 1 !important; box-shadow: 0 0 10px rgba(144, 115, 218, 0.5); }
    .loser { opacity: 0.25; }
    .tie { opacity: 1; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const {
      Container, Box, Typography, TextField, Button, Accordion, AccordionSummary,
      AccordionDetails, Paper, Grid, IconButton, Tooltip, CircularProgress, Card, CardContent
    } = MaterialUI;

    function PitViewApp() {
      const [config, setConfig] = React.useState({
        teamName: "Robotics Team",
        teamNum: "12345",
        season: "2024",
        eventCode: "USCHSMP",
        logo: "",
        portfolioPdf: "",
        colors: { bg: "#f8f9fa", text: "#1a1a1a", accent: "#9073da", red: "#e63946", blue: "#0077b6" },
        slides: []
      });

      const [isDisplaying, setIsDisplaying] = React.useState(false);
      const [currentSlideIdx, setCurrentSlideIdx] = React.useState(0);
      const [verificationStatus, setVerificationStatus] = React.useState(null);
      const [verifying, setVerifying] = React.useState(false);
      const [matchData, setMatchData] = React.useState({ upcoming: [], completed: [] });

      // Handle Verification of Team and Event Data
      const handleVerify = async () => {
        setVerifying(true);
        setVerificationStatus(null);
        try {
          const res = await fetch(`https://api.ftcscout.org/rest/v1/events/${config.season}/${config.eventCode}/matches`);
          if (!res.ok) {
            setVerificationStatus({ success: false, msg: `Event '${config.eventCode}' not found for ${config.season}.` });
            setVerifying(false);
            return;
          }
          const matches = await res.json();
          const teamMatches = matches.filter(m => 
            (m.teams || []).some(t => String(t.teamNumber) === String(config.teamNum))
          );

          if (teamMatches.length > 0 || matches.length > 0) {
            setVerificationStatus({ 
              success: true, 
              msg: `Verified! ${matches.length} matches indexed (${teamMatches.length} for #${config.teamNum}).` 
            });
          } else {
            setVerificationStatus({ success: false, msg: `Event valid, but team #${config.teamNum} is not listed yet.` });
          }
        } catch (err) {
          setVerificationStatus({ success: false, msg: `Connection error validating FTC data.` });
        }
        setVerifying(false);
      };

      // Add Slide to Timeline
      const addSlide = (type) => {
        setConfig(prev => ({
          ...prev,
          slides: [...prev.slides, { id: Date.now(), type, duration: 10, content: "" }]
        }));
      };

      // Slide Timeline Actions
      const moveSlide = (idx, dir) => {
        const target = idx + dir;
        if (target < 0 || target >= config.slides.length) return;
        const updated = [...config.slides];
        const temp = updated[idx];
        updated[idx] = updated[target];
        updated[target] = temp;
        setConfig(prev => ({ ...prev, slides: updated }));
      };

      const removeSlide = (idx) => {
        setConfig(prev => ({ ...prev, slides: prev.slides.filter((_, i) => i !== idx) }));
      };

      // Image / PDF Handling
      const handleFileUpload = (e, key) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setConfig(prev => ({ ...prev, [key]: reader.result }));
        reader.readAsDataURL(file);
      };

      // Slide Cycle Timer
      React.useEffect(() => {
        if (!isDisplaying || config.slides.length === 0) return;
        const currentSlide = config.slides[currentSlideIdx];
        const timer = setTimeout(() => {
          setCurrentSlideIdx((prev) => (prev + 1) % config.slides.length);
        }, (currentSlide?.duration || 10) * 1000);

        return () => clearTimeout(timer);
      }, [isDisplaying, currentSlideIdx, config.slides]);

      // Fetch Matches when Match Slide Displays
      React.useEffect(() => {
        if (!isDisplaying) return;
        const slide = config.slides[currentSlideIdx];
        if (slide?.type === 'matches') {
          fetchMatches();
        }
      }, [isDisplaying, currentSlideIdx]);

      const fetchMatches = async () => {
        try {
          const res = await fetch(`https://api.ftcscout.org/rest/v1/events/${config.season}/${config.eventCode}/matches`);
          if (!res.ok) return;
          const matches = await res.json();
          
          const teamMatches = matches.filter(m => 
            (m.teams || []).some(t => String(t.teamNumber) === String(config.teamNum))
          );

          const upcoming = [];
          const completed = [];

          teamMatches.forEach(m => {
            const redTeams = (m.teams || []).filter(t => t.alliance === 'Red').map(t => t.teamNumber);
            const blueTeams = (m.teams || []).filter(t => t.alliance === 'Blue').map(t => t.teamNumber);
            const redScore = m.scores?.redPoints ?? null;
            const blueScore = m.scores?.bluePoints ?? null;

            const isDone = redScore !== null && blueScore !== null;
            const item = {
              num: m.matchNum || m.matchNumber || 'Qual',
              redTeams, blueTeams, redScore, blueScore, isDone,
              winner: redScore > blueScore ? 'red' : blueScore > redScore ? 'blue' : 'tie'
            };

            if (isDone) completed.push(item);
            else upcoming.push(item);
          });

          setMatchData({ upcoming, completed });
        } catch (e) {
          console.error("Failed to load match updates", e);
        }
      };

      // Export / Import JSON Configuration
      const exportConfig = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(config));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = `pit_view_config.json`;
        a.click();
      };

      const importConfig = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const imported = JSON.parse(event.target.result);
          const newSeason = prompt("Confirm/Update Season:", imported.season || "2024");
          const newEvent = prompt("Confirm/Update Event Code:", imported.eventCode || "");
          if (newSeason) imported.season = newSeason;
          if (newEvent) imported.eventCode = newEvent;
          setConfig(imported);
        };
        reader.readAsText(file);
      };

      // PDF Renderer Component
      const PDFRender = ({ data }) => {
        const canvasRef = React.useRef(null);
        React.useEffect(() => {
          if (!data || !canvasRef.current) return;
          pdfjsLib.getDocument(data).promise.then(pdf => {
            pdf.getPage(1).then(page => {
              const viewport = page.getViewport({ scale: 1.2 });
              const canvas = canvasRef.current;
              const context = canvas.getContext('2d');
              canvas.height = viewport.height;
              canvas.width = viewport.width;
              page.render({ canvasContext: context, viewport });
            });
          });
        }, [data]);
        return <canvas ref={canvasRef} />;
      };

      return (
        <Box sx={{ width: '100vw', height: '100vh', bgcolor: config.colors.bg, color: config.colors.text }}>
          
          {/* CONFIGURATION UI SCREEN */}
          {!isDisplaying ? (
            <Container maxWidth="md" sx={{ py: 4, height: '100vh', overflowY: 'auto' }}>
              <Box display="flex" justifyContent="space-between" alignItems="center" mb={3}>
                <Typography variant="h4" fontWeight="bold" color="primary">Pit View Setup</Typography>
                <Box display="flex" gap={1}>
                  <Button variant="outlined" onClick={exportConfig}>Export</Button>
                  <Button variant="outlined" component="label">
                    Import
                    <input type="file" hidden accept=".json" onChange={importConfig} />
                  </Button>
                  <Button 
                    variant="contained" 
                    sx={{ bgcolor: '#9073da', '&:hover': { bgcolor: '#7b5ec7' } }} 
                    onClick={() => { if(config.slides.length) setIsDisplaying(true); else alert("Add a slide first!"); }}
                  >
                    Finish
                  </Button>
                </Box>
              </Box>

              <Grid container spacing={2} mb={2}>
                <Grid item xs={6}>
                  <TextField fullWidth label="Team Name (Cosmetic)" value={config.teamName} onChange={e => setConfig({...config, teamName: e.target.value})} />
                </Grid>
                <Grid item xs={6}>
                  <TextField fullWidth label="Team #" type="number" value={config.teamNum} onChange={e => setConfig({...config, teamNum: e.target.value})} />
                </Grid>
              </Grid>

              <Grid container spacing={2} mb={2}>
                <Grid item xs={6}>
                  <Button variant="contained" component="label" fullWidth>
                    Upload Logo
                    <input type="file" hidden accept="image/*" onChange={e => handleFileUpload(e, 'logo')} />
                  </Button>
                </Grid>
                <Grid item xs={6}>
                  <Button variant="contained" component="label" fullWidth>
                    Upload Portfolio (PDF)
                    <input type="file" hidden accept="application/pdf" onChange={e => handleFileUpload(e, 'portfolioPdf')} />
                  </Button>
                </Grid>
              </Grid>

              {/* Event Settings Accordion */}
              <Accordion defaultExpanded sx={{ mb: 2 }}>
                <AccordionSummary expandIcon={<span class="material-icons">expand_more</span>}>
                  <Typography fontWeight="bold">FTC Event Settings</Typography>
                </AccordionSummary>
                <AccordionDetails>
                  <Grid container spacing={2} alignItems="center">
                    <Grid item xs={4}>
                      <TextField fullWidth label="Season (e.g. 2024)" value={config.season} onChange={e => setConfig({...config, season: e.target.value})} />
                    </Grid>
                    <Grid item xs={4}>
                      <TextField fullWidth label="Event Code (e.g. USCHSMP)" value={config.eventCode} onChange={e => setConfig({...config, eventCode: e.target.value})} />
                    </Grid>
                    <Grid item xs={4}>
                      <Button variant="contained" onClick={handleVerify} disabled={verifying} fullWidth>
                        {verifying ? <CircularProgress size={24} /> : "Check Data"}
                      </Button>
                    </Grid>
                  </Grid>

                  {/* SVG Checkmark or Inline Verification Status */}
                  {verificationStatus && (
                    <Box display="flex" alignItems="center" gap={1} mt={2}>
                      {verificationStatus.success ? (
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2ec4b6" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                          <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                      ) : (
                        <span class="material-icons" style={{ color: config.colors.red }}>error</span>
                      )}
                      <Typography variant="body2" color={verificationStatus.success ? '#2ec4b6' : 'error'}>
                        {verificationStatus.msg}
                      </Typography>
                    </Box>
                  )}

                  <Typography variant="caption" color="textSecondary" display="block" mt={1}>
                    Find codes on <a href="https://ftcscout.org/events" target="_blank" style={{ color: '#9073da' }}>FTCScout</a>
                  </Typography>
                </AccordionDetails>
              </Accordion>

              {/* Theme Colors Accordion */}
              <Accordion sx={{ mb: 3 }}>
                <AccordionSummary expandIcon={<span class="material-icons">expand_more</span>}>
                  <Typography fontWeight="bold">Colors</Typography>
                </AccordionSummary>
                <AccordionDetails>
                  <Grid container spacing={2}>
                    {Object.keys(config.colors).map(key => (
                      <Grid item xs={4} key={key}>
                        <Typography variant="caption" style={{ textTransform: 'capitalize' }}>{key}</Typography>
                        <input 
                          type="color" 
                          value={config.colors[key]} 
                          onChange={e => setConfig({...config, colors: {...config.colors, [key]: e.target.value}})}
                          style={{ width: '100%', height: '40px', border: 'none', cursor: 'pointer' }}
                        />
                      </Grid>
                    ))}
                  </Grid>
                </AccordionDetails>
              </Accordion>

              {/* Timeline Setup */}
              <Typography variant="h6" mb={1}>Timeline Setup</Typography>
              <Box display="flex" gap={1} mb={2}>
                <Button variant="outlined" onClick={() => addSlide('logo')}>+ Logo</Button>
                <Button variant="outlined" onClick={() => addSlide('text')}>+ Text</Button>
                <Button variant="outlined" onClick={() => addSlide('matches')}>+ Matches</Button>
                <Button variant="outlined" onClick={() => addSlide('portfolio')}>+ Portfolio</Button>
              </Box>

              <Box display="flex" gap={2} sx={{ overflowX: 'auto', pb: 2 }}>
                {config.slides.map((slide, i) => (
                  <Paper key={slide.id} sx={{ p: 2, minWidth: 160, display: 'flex', flexDirection: 'column', gap: 1 }}>
                    <Typography fontWeight="bold" textTransform="uppercase" variant="body2">{slide.type}</Typography>
                    {slide.type === 'text' && (
                      <TextField 
                        size="small" 
                        placeholder="Content" 
                        value={slide.content} 
                        onChange={e => {
                          const updated = [...config.slides];
                          updated[i].content = e.target.value;
                          setConfig({...config, slides: updated});
                        }} 
                      />
                    )}
                    <TextField 
                      size="small" 
                      type="number" 
                      label="Secs" 
                      value={slide.duration} 
                      onChange={e => {
                        const updated = [...config.slides];
                        updated[i].duration = parseInt(e.target.value) || 5;
                        setConfig({...config, slides: updated});
                      }} 
                    />
                    <Box display="flex" justifyContent="space-between">
                      <IconButton size="small" onClick={() => moveSlide(i, -1)}><span class="material-icons">arrow_back</span></IconButton>
                      <IconButton size="small" onClick={() => moveSlide(i, 1)}><span class="material-icons">arrow_forward</span></IconButton>
                      <IconButton size="small" color="error" onClick={() => removeSlide(i)}><span class="material-icons">delete</span></IconButton>
                    </Box>
                  </Paper>
                ))}
              </Box>
            </Container>
          ) : (
            
            /* DISPLAY SLIDESHOW SCREEN */
            <Box position="relative" width="100vw" height="100vh">
              {/* Controls Overlay */}
              <Box position="absolute" top={16} right={16} zIndex={1000} display="flex" gap={1}>
                <IconButton 
                  onClick={() => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()}
                  sx={{ bgcolor: 'white', '&:hover': { bgcolor: '#eee' } }}
                >
                  <span class="material-icons">fullscreen</span>
                </IconButton>
                <IconButton 
                  onClick={() => setIsDisplaying(false)} 
                  sx={{ bgcolor: 'white', '&:hover': { bgcolor: '#eee' } }}
                >
                  <span class="material-icons">arrow_back</span>
                </IconButton>
              </Box>

              {/* Current Slide Display */}
              <Box width="100%" height="100%" display="flex" justifyContent="center" alignItems="center" p={4} boxSizing="border-box">
                {config.slides[currentSlideIdx]?.type === 'logo' && (
                  config.logo ? <img src={config.logo} style={{ maxHeight: '70vh', maxWidth: '80vw' }} /> : <Typography variant="h1">{config.teamName}</Typography>
                )}

                {config.slides[currentSlideIdx]?.type === 'text' && (
                  <Typography variant="h2" align="center">{config.slides[currentSlideIdx]?.content}</Typography>
                )}

                {config.slides[currentSlideIdx]?.type === 'portfolio' && (
                  config.portfolioPdf ? <PDFRender data={config.portfolioPdf} /> : <Typography variant="h4">No PDF Uploaded</Typography>
                )}

                {config.slides[currentSlideIdx]?.type === 'matches' && (
                  <Box width="100%" height="100%" display="flex" flexDirection="column">
                    <Typography variant="h4" mb={2} align="center">Match Schedule</Typography>
                    <Grid container spacing={3} sx={{ flexGrow: 1, overflow: 'hidden' }}>
                      <Grid item xs={6} sx={{ height: '100%', overflowY: 'auto' }}>
                        <Typography variant="h6" mb={1}>Upcoming</Typography>
                        {matchData.upcoming.map((m, idx) => (
                          <Card key={idx} sx={{ mb: 1 }}>
                            <CardContent>
                              <Typography variant="subtitle2">Match {m.num}</Typography>
                              <Box className="alliance-card" sx={{ bgcolor: config.colors.red, mb: 0.5 }}>
                                <span>Red: {m.redTeams.join(', ')}</span><span>-</span>
                              </Box>
                              <Box className="alliance-card" sx={{ bgcolor: config.colors.blue }}>
                                <span>Blue: {m.blueTeams.join(', ')}</span><span>-</span>
                              </Box>
                            </CardContent>
                          </Card>
                        ))}
                      </Grid>
                      <Grid item xs={6} sx={{ height: '100%', overflowY: 'auto' }}>
                        <Typography variant="h6" mb={1}>Completed</Typography>
                        {matchData.completed.map((m, idx) => (
                          <Card key={idx} sx={{ mb: 1 }}>
                            <CardContent>
                              <Typography variant="subtitle2">Match {m.num}</Typography>
                              <Box className={`alliance-card ${m.winner === 'red' ? 'winner' : m.winner === 'blue' ? 'loser' : 'tie'}`} sx={{ bgcolor: config.colors.red, mb: 0.5 }}>
                                <span>Red: {m.redTeams.join(', ')}</span><span>{m.redScore}</span>
                              </Box>
                              <Box className={`alliance-card ${m.winner === 'blue' ? 'winner' : m.winner === 'red' ? 'loser' : 'tie'}`} sx={{ bgcolor: config.colors.blue }}>
                                <span>Blue: {m.blueTeams.join(', ')}</span><span>{m.blueScore}</span>
                              </Box>
                            </CardContent>
                          </Card>
                        ))}
                      </Grid>
                    </Grid>
                  </Box>
                )}
              </Box>
            </Box>
          )}

        </Box>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PitViewApp />);
  </script>
</body>
</html>
